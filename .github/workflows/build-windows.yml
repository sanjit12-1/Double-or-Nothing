      - name: Build Windows
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build

          godot --headless --path . --export-release "Windows Desktop" "build/DoubleOrNothing.exe"

          Write-Host "=== BUILD DIRECTORY ==="
          Get-ChildItem -Path build -Recurse

          Write-Host "=== EXPORT PRESET ==="
          Get-Content export_presets.cfg

          if (!(Test-Path "build/DoubleOrNothing.exe")) {
            Write-Error "Windows EXE was not created!"
            exit 1
          }
